name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  GOFLAGS: -mod=readonly

jobs:
  build-and-test:
    name: build, test, race, vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify module integrity
        run: |
          go mod verify
          test -z "$(gofmt -l cmd internal tests)" || { echo "gofmt required:"; gofmt -l cmd internal tests; exit 1; }

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -count=1 -race ./...

      - name: Coverage
        run: |
          go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  flakiness:
    name: repeated suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Run the whole suite three times
        run: make test-repeat REPEAT=3

  integration:
    name: integration and security suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Integration tests
        run: go test -count=1 -v ./tests/integration/...

      - name: Security tests
        run: go test -count=1 -v ./tests/security/...

      - name: Fail if the suite is running privileged
        run: |
          euid=$(id -u)
          echo "euid: $euid"
          if [ "$euid" = "0" ]; then
            echo "::error::the unprivileged suite ran as root, so its unprivileged checks were skipped"
            exit 1
          fi

  fuzz:
    name: configuration parser fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Fuzz configuration parsers
        run: make fuzz FUZZ_TIME=30s

      - name: Report newly written corpus entries
        run: |
          new_entries="$(git status --porcelain -- internal/config/testdata)"
          if [ -n "$new_entries" ]; then
            echo "::error::the configuration fuzzers wrote new corpus entries; commit them"
            echo "$new_entries"
            exit 1
          fi

  fuzz-packet:
    name: packet parser and checksum fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Replay the recorded packet corpus
        run: go test -count=1 -run 'Fuzz' ./internal/packet/

      - name: Fuzz packet parsers and checksum
        run: make fuzz-packet FUZZ_TIME=30s

      - name: Report newly written corpus entries
        run: |
          new_entries="$(git status --porcelain -- internal/packet/testdata)"
          if [ -n "$new_entries" ]; then
            echo "::error::the packet fuzzers wrote new corpus entries; commit them"
            echo "$new_entries"
            exit 1
          fi

  fuzz-router:
    name: forwarding decision fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Replay the recorded forwarding corpus
        run: go test -count=1 -run 'Fuzz' ./internal/router/

      - name: Fuzz the forwarding decision and the ICMP it builds
        run: make fuzz-router FUZZ_TIME=30s

      - name: Report newly written corpus entries
        run: |
          new_entries="$(git status --porcelain -- internal/router/testdata)"
          if [ -n "$new_entries" ]; then
            echo "::error::the router fuzzers wrote new corpus entries; commit them"
            echo "$new_entries"
            exit 1
          fi

  static-analysis:
    name: static analysis and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
