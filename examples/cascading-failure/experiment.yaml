
name: cascading-failure

seed: 123456

scope:
  network: 10.42.0.0/16
  namespaces:
    - client
    - router
    - lb
    - service-a
    - service-b
    - service-c

limits:
  max_namespaces: 8
  max_interfaces: 16
  max_duration: 5m
  max_bandwidth: 1Gbps
  max_packet_rate: 100000
  max_concurrent_probes: 64

faults:
  - target: service-b
    type: packet_loss
    value: 10%
