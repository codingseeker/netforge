name: faults
seed: 7

scope:
  network: 10.42.0.0/16
  namespaces:
    - nf-client
    - nf-server
    - nf-router

limits:
  max_duration: 5m
  max_bandwidth: 1Gbps

faults:
  - target: nf-client
    interface: nfc0
    type: latency
    value: 60ms
    duration: 1m

  - target: nf-server
    interface: nfs0
    type: jitter
    value: 30ms
    delay: 60ms
    duration: 1m

  - target: nf-router
    interface: nfc0
    type: packet_loss
    value: 10%
    correlation: 25%
    duration: 30s

  - target: nf-client
    interface: nfr0
    type: bandwidth
    value: 200kbps
    duration: 1m

  - target: nf-server
    interface: nfs0
    direction: in
    type: duplication
    value: 5%
    duration: 30s

  - target: nf-client
    interface: nfr0
    direction: in
    type: reordering
    value: 20%
    delay: 40ms
    gap: "3"
    queue: "500"
    duration: 30s
